syntax = "proto3";

package user.v1;

import "google/protobuf/empty.proto";

service UserService {
  rpc GetFilteredUsers (google.protobuf.Empty) returns (ListUsersResponse);
}

message User {
  int32 id = 1;
  string name = 2;
  int32 age = 3;
}

message ListUsersResponse {
  repeated User users = 1;
}